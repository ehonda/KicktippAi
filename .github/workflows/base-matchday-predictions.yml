name: Base Matchday Predictions

# Reusable workflow for matchday predictions
on:
  workflow_call:
    inputs:
      community:
        description: 'Kicktipp posting community name'
        required: true
        type: string
      community_context:
        description: 'Community context used to resolve stored predictions'
        required: true
        type: string
      competition:
        description: 'Exact competition identifier'
        required: true
        type: string
      model:
        description: 'Pinned OpenAI model'
        required: true
        type: string
      reasoning_effort:
        description: 'Pinned OpenAI reasoning effort'
        required: true
        type: string
      max_output_tokens:
        description: 'Pinned maximum output token cap'
        required: true
        type: number
      prompt_source:
        description: 'Exact prompt source; operational callers use langfuse'
        required: true
        type: string
      langfuse_prompt_name:
        description: 'Exact hosted prompt name when prompt_source is langfuse'
        required: false
        type: string
        default: ''
      langfuse_prompt_label:
        description: 'Optional hosted prompt label used alongside the numbered version'
        required: false
        type: string
        default: ''
      langfuse_prompt_version:
        description: 'Exact numbered hosted prompt version when prompt_source is langfuse'
        required: false
        type: number
        default: 0
      retired_configuration:
        description: 'Explicitly fail a historical unversioned caller before any prediction work'
        required: false
        type: boolean
        default: false
      trigger_type:
        description: 'How this workflow was triggered (scheduled, manual)'
        required: true
        type: string
      force_prediction:
        description: 'Force prediction even if verify passes'
        required: false
        type: boolean
        default: false
      max_repredictions:
        description: 'Maximum number of repredictions allowed (0-based index)'
        required: false
        type: number
        default: 2
    secrets:
      kicktipp_username:
        description: 'Kicktipp username for this community'
        required: true
      kicktipp_password:
        description: 'Kicktipp password for this community'
        required: true
      firebase_project_id:
        description: 'Firebase project ID'
        required: true
      firebase_service_account_json:
        description: 'Firebase service account JSON'
        required: true
      openai_api_key:
        description: 'OpenAI API key'
        required: true
      langfuse_secret_key:
        description: 'Langfuse secret key for tracing'
        required: false

env:
  TZ: 'Europe/Berlin'

jobs:
  matchday-predictions:
    name: Matchday Predictions
    runs-on: ubuntu-latest
    env:
      COMMUNITY: ${{ inputs.community }}
      COMMUNITY_CONTEXT: ${{ inputs.community_context }}
      COMPETITION: ${{ inputs.competition }}
      MODEL: ${{ inputs.model }}
      REASONING_EFFORT: ${{ inputs.reasoning_effort }}
      MAX_OUTPUT_TOKENS: ${{ inputs.max_output_tokens }}
      PROMPT_SOURCE: ${{ inputs.prompt_source }}
      LANGFUSE_PROMPT_NAME: ${{ inputs.langfuse_prompt_name }}
      LANGFUSE_PROMPT_LABEL: ${{ inputs.langfuse_prompt_label }}
      LANGFUSE_PROMPT_VERSION: ${{ inputs.langfuse_prompt_version }}
      RETIRED_CONFIGURATION: ${{ inputs.retired_configuration }}
      TRIGGER_TYPE: ${{ inputs.trigger_type }}
      FORCE_PREDICTION: ${{ inputs.force_prediction }}
      MAX_REPREDICTIONS: ${{ inputs.max_repredictions }}

    steps:
      - name: Validate pinned prediction configuration
        shell: bash
        run: |
          if [ "$RETIRED_CONFIGURATION" = "true" ]; then
            echo "::error::This historical prediction configuration is retired because it has no truthful numbered prompt identity."
            exit 1
          fi

          for required_name in COMMUNITY COMMUNITY_CONTEXT COMPETITION MODEL REASONING_EFFORT PROMPT_SOURCE; do
            required_value="${!required_name}"
            if [ -z "${required_value//[[:space:]]/}" ]; then
              echo "::error::$required_name must be explicit and non-empty."
              exit 1
            fi
          done

          if [[ ! "$MAX_OUTPUT_TOKENS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::MAX_OUTPUT_TOKENS must be a positive pinned integer."
            exit 1
          fi

          if [[ ! "$REASONING_EFFORT" =~ ^(none|minimal|low|medium|high|xhigh|max)$ ]]; then
            echo "::error::REASONING_EFFORT must be one supported explicit value."
            exit 1
          fi

          if [ "$PROMPT_SOURCE" != "langfuse" ]; then
            echo "::error::Operational prediction workflows require prompt_source=langfuse; local unversioned routes must remain retired."
            exit 1
          fi

          if [ -z "${LANGFUSE_PROMPT_NAME//[[:space:]]/}" ] || [[ ! "$LANGFUSE_PROMPT_VERSION" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Hosted prediction workflows require an exact prompt name and numbered version."
            exit 1
          fi

          case "$COMPETITION|$LANGFUSE_PROMPT_NAME" in
            "bundesliga-2026-27|kicktippai/bundesliga-2026-27/predict-one-match"|\
            "fifa-world-cup-2026|kicktippai/wm26/predict-one-match") ;;
            *)
              echo "::error::The competition and match prompt route do not form a supported exact identity."
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore --configuration Release

      - name: Verify current predictions
        id: verify
        continue-on-error: true
        run: |
          echo "Verifying current matchday predictions..."
          echo "Community: $COMMUNITY"
          echo "Competition: $COMPETITION"
          echo "Model: $MODEL"
          echo "Reasoning Effort: $REASONING_EFFORT"
          echo "Max Output Tokens: $MAX_OUTPUT_TOKENS"
          echo "Community Context: $COMMUNITY_CONTEXT"
          echo "Prompt: $PROMPT_SOURCE $LANGFUSE_PROMPT_NAME v$LANGFUSE_PROMPT_VERSION"
          PROMPT_LABEL_FLAGS=()
          if [ -n "$LANGFUSE_PROMPT_LABEL" ]; then
            PROMPT_LABEL_FLAGS+=(--langfuse-prompt-label "$LANGFUSE_PROMPT_LABEL")
          fi
          dotnet run --project src/Orchestrator --configuration Release -- verify "$MODEL" --community "$COMMUNITY" --community-context "$COMMUNITY_CONTEXT" --competition "$COMPETITION" --reasoning-effort "$REASONING_EFFORT" --max-output-tokens "$MAX_OUTPUT_TOKENS" --prompt-source "$PROMPT_SOURCE" --langfuse-prompt-name "$LANGFUSE_PROMPT_NAME" --langfuse-prompt-version "$LANGFUSE_PROMPT_VERSION" --init-matchday --check-outdated --agent --verbose "${PROMPT_LABEL_FLAGS[@]}"
        env:
          KICKTIPP_USERNAME: ${{ secrets.kicktipp_username }}
          KICKTIPP_PASSWORD: ${{ secrets.kicktipp_password }}
          FIREBASE_PROJECT_ID: ${{ secrets.firebase_project_id }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.firebase_service_account_json }}
          OPENAI_API_KEY: ${{ secrets.openai_api_key }}

      - name: Generate and post predictions
        id: generate
        if: steps.verify.outcome == 'failure' || inputs.force_prediction == true
        run: |
          echo "Generating predictions with model: $MODEL"
          echo "Community: $COMMUNITY"
          echo "Competition: $COMPETITION"
          echo "Community Context: $COMMUNITY_CONTEXT"
          echo "Reasoning Effort: $REASONING_EFFORT"
          echo "Max Output Tokens: $MAX_OUTPUT_TOKENS"
          echo "Prompt: $PROMPT_SOURCE $LANGFUSE_PROMPT_NAME v$LANGFUSE_PROMPT_VERSION"
          echo "Max Repredictions: $MAX_REPREDICTIONS"

          PREDICTION_FLAGS=()
          if [ "$FORCE_PREDICTION" = "true" ]; then
            PREDICTION_FLAGS+=(--override-database)
          else
            PREDICTION_FLAGS+=(--max-repredictions "$MAX_REPREDICTIONS")
          fi
          if [ -n "$LANGFUSE_PROMPT_LABEL" ]; then
            PREDICTION_FLAGS+=(--langfuse-prompt-label "$LANGFUSE_PROMPT_LABEL")
          fi

          dotnet run --project src/Orchestrator --configuration Release -- matchday "$MODEL" --community "$COMMUNITY" --community-context "$COMMUNITY_CONTEXT" --competition "$COMPETITION" --reasoning-effort "$REASONING_EFFORT" --max-output-tokens "$MAX_OUTPUT_TOKENS" --prompt-source "$PROMPT_SOURCE" --langfuse-prompt-name "$LANGFUSE_PROMPT_NAME" --langfuse-prompt-version "$LANGFUSE_PROMPT_VERSION" --override-kicktipp --verbose --agent "${PREDICTION_FLAGS[@]}"
        env:
          KICKTIPP_USERNAME: ${{ secrets.kicktipp_username }}
          KICKTIPP_PASSWORD: ${{ secrets.kicktipp_password }}
          FIREBASE_PROJECT_ID: ${{ secrets.firebase_project_id }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.firebase_service_account_json }}
          OPENAI_API_KEY: ${{ secrets.openai_api_key }}
          LANGFUSE_PUBLIC_KEY: ${{ vars.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.langfuse_secret_key }}

      - name: Final verification
        if: steps.verify.outcome == 'failure' || inputs.force_prediction == true
        run: |
          echo "Running final verification to confirm predictions were posted successfully..."
          PROMPT_LABEL_FLAGS=()
          if [ -n "$LANGFUSE_PROMPT_LABEL" ]; then
            PROMPT_LABEL_FLAGS+=(--langfuse-prompt-label "$LANGFUSE_PROMPT_LABEL")
          fi
          dotnet run --project src/Orchestrator --configuration Release -- verify "$MODEL" --community "$COMMUNITY" --community-context "$COMMUNITY_CONTEXT" --competition "$COMPETITION" --reasoning-effort "$REASONING_EFFORT" --max-output-tokens "$MAX_OUTPUT_TOKENS" --prompt-source "$PROMPT_SOURCE" --langfuse-prompt-name "$LANGFUSE_PROMPT_NAME" --langfuse-prompt-version "$LANGFUSE_PROMPT_VERSION" --require-matches --check-outdated --agent --verbose "${PROMPT_LABEL_FLAGS[@]}"
        env:
          KICKTIPP_USERNAME: ${{ secrets.kicktipp_username }}
          KICKTIPP_PASSWORD: ${{ secrets.kicktipp_password }}
          FIREBASE_PROJECT_ID: ${{ secrets.firebase_project_id }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.firebase_service_account_json }}
          OPENAI_API_KEY: ${{ secrets.openai_api_key }}

      - name: Success notification
        if: steps.verify.outcome == 'success' && inputs.force_prediction == false
        run: echo "All predictions are up to date - no action needed"

      - name: Workflow summary
        if: always()
        env:
          INITIAL_VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          printf '%s\n' "## Matchday Predictions Summary" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- **Community**: $COMMUNITY" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- **Community Context**: $COMMUNITY_CONTEXT" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- **Competition**: $COMPETITION" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- **Model**: $MODEL" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- **Reasoning Effort**: $REASONING_EFFORT" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- **Max Output Tokens**: $MAX_OUTPUT_TOKENS" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- **Prompt Source**: $PROMPT_SOURCE" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- **Prompt Name**: $LANGFUSE_PROMPT_NAME" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- **Prompt Version**: $LANGFUSE_PROMPT_VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- **Max Repredictions**: $MAX_REPREDICTIONS" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- **Trigger**: $TRIGGER_TYPE" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- **Initial Verify Result**: $INITIAL_VERIFY_RESULT" >> "$GITHUB_STEP_SUMMARY"
