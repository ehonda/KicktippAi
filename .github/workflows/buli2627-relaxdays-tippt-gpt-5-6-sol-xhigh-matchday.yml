name: Bundesliga 2026/27 relaxdays-tippt Sol xhigh copy - Matchday

on:
  workflow_dispatch:
    inputs:
      force_prediction:
        description: 'Force prediction even if verify passes'
        required: false
        default: false
        type: boolean
      max_repredictions:
        description: 'Maximum number of repredictions allowed (0-based index)'
        required: false
        default: 2
        type: number

concurrency:
  group: bundesliga-2026-27-production-live-lane
  cancel-in-progress: false

jobs:
  call-base-workflow:
    name: Copy Matchday Predictions
    uses: ./.github/workflows/base-matchday-predictions.yml
    with:
      community: "relaxdays-tippt"
      community_context: "pes-squad"
      competition: "bundesliga-2026-27"
      model: "gpt-5.6-sol"
      reasoning_effort: "xhigh"
      max_output_tokens: 10000
      prompt_source: "langfuse"
      langfuse_prompt_name: "kicktippai/bundesliga-2026-27/predict-one-match"
      langfuse_prompt_label: "production"
      langfuse_prompt_version: 3
      trigger_type: "manual"
      force_prediction: ${{ inputs.force_prediction }}
      max_repredictions: ${{ fromJSON(inputs.max_repredictions) }}
    secrets:
      kicktipp_username: ${{ secrets.RELAXDAYS_TIPPT_KICKTIPP_USERNAME }}
      kicktipp_password: ${{ secrets.RELAXDAYS_TIPPT_KICKTIPP_PASSWORD }}
      firebase_project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
      firebase_service_account_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      langfuse_secret_key: ${{ secrets.LANGFUSE_SECRET_KEY }}
