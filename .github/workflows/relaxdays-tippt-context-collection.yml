name: relaxdays-tippt ⚽ Context Collection

on:
  workflow_dispatch:

concurrency:
  group: bundesliga-2026-27-production-live-lane
  cancel-in-progress: false

jobs:
  call-base-workflow:
    name: Context Collection - relaxdays-tippt
    uses: ./.github/workflows/base-context-collection.yml
    with:
      community_context: "relaxdays-tippt"
      competition: "bundesliga-2026-27"
      trigger_type: "manual"
      publish_launch_roster_overlay: true
    secrets:
      kicktipp_username: ${{ secrets.RELAXDAYS_TIPPT_KICKTIPP_USERNAME }}
      kicktipp_password: ${{ secrets.RELAXDAYS_TIPPT_KICKTIPP_PASSWORD }}
      firebase_project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
      firebase_service_account_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
