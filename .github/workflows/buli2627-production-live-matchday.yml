name: Bundesliga 2026/27 production live - Matchday

on:
  workflow_dispatch:

concurrency:
  group: bundesliga-2026-27-production-live-lane
  cancel-in-progress: false

jobs:
  pes-squad-context:
    name: Context - pes-squad
    uses: ./.github/workflows/base-context-collection.yml
    with:
      community_context: "pes-squad"
      competition: "bundesliga-2026-27"
      trigger_type: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
      publish_launch_roster_overlay: false
    secrets:
      kicktipp_username: ${{ secrets.PES_SQUAD_KICKTIPP_USERNAME }}
      kicktipp_password: ${{ secrets.PES_SQUAD_KICKTIPP_PASSWORD }}
      firebase_project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
      firebase_service_account_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

  pes-squad-matchday:
    name: Matchday - pes-squad Sol xhigh production
    needs: pes-squad-context
    uses: ./.github/workflows/base-matchday-predictions.yml
    with:
      community: "pes-squad"
      community_context: "pes-squad"
      competition: "bundesliga-2026-27"
      model: "gpt-5.6-sol"
      reasoning_effort: "xhigh"
      max_output_tokens: 10000
      prompt_source: "langfuse"
      langfuse_prompt_name: "kicktippai/bundesliga-2026-27/predict-one-match"
      langfuse_prompt_label: "production"
      langfuse_prompt_version: 3
      trigger_type: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
      force_prediction: false
      max_repredictions: 2
    secrets:
      kicktipp_username: ${{ secrets.PES_SQUAD_KICKTIPP_USERNAME }}
      kicktipp_password: ${{ secrets.PES_SQUAD_KICKTIPP_PASSWORD }}
      firebase_project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
      firebase_service_account_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      langfuse_secret_key: ${{ secrets.LANGFUSE_SECRET_KEY }}

  relaxdays-tippt-context:
    name: Context - relaxdays-tippt
    needs: pes-squad-matchday
    uses: ./.github/workflows/base-context-collection.yml
    with:
      community_context: "relaxdays-tippt"
      competition: "bundesliga-2026-27"
      trigger_type: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
