name: Bundesliga 2026/27 ehonda-ai-arena Luna validation - Scheduled cycle

on:
  schedule:
    - cron: '47 8 * * *'

concurrency:
  group: p0-20-ehonda-ai-arena-luna-scheduled-cycle
  cancel-in-progress: false

jobs:
  context:
    name: Collect arena context
    uses: ./.github/workflows/base-context-collection.yml
    with:
      community_context: "ehonda-ai-arena"
      competition: "bundesliga-2026-27"
      trigger_type: "scheduled"
    secrets:
      kicktipp_username: ${{ secrets.EHONDA_AI_ARENA_GPT_5_6_LUNA_NONE_KICKTIPP_USERNAME }}
      kicktipp_password: ${{ secrets.EHONDA_AI_ARENA_GPT_5_6_LUNA_NONE_KICKTIPP_PASSWORD }}
      firebase_project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
      firebase_service_account_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

  matchday:
    name: Force arena matchday validation
    needs: context
    uses: ./.github/workflows/base-matchday-predictions.yml
    with:
      community: "ehonda-ai-arena"
      community_context: "ehonda-ai-arena"
      competition: "bundesliga-2026-27"
      model: "gpt-5.6-luna"
      reasoning_effort: "none"
      max_output_tokens: 10000
      prompt_source: "langfuse"
      langfuse_prompt_name: "kicktippai/bundesliga-2026-27/predict-one-match"
      langfuse_prompt_label: "production"
      langfuse_prompt_version: 2
      trigger_type: "scheduled"
      force_prediction: true
      max_repredictions: 0
    secrets:
      kicktipp_username: ${{ secrets.EHONDA_AI_ARENA_GPT_5_6_LUNA_NONE_KICKTIPP_USERNAME }}
      kicktipp_password: ${{ secrets.EHONDA_AI_ARENA_GPT_5_6_LUNA_NONE_KICKTIPP_PASSWORD }}
      firebase_project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
      firebase_service_account_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      langfuse_secret_key: ${{ secrets.LANGFUSE_SECRET_KEY }}

  bonus:
    name: Force arena bonus validation
    needs: matchday
    uses: ./.github/workflows/base-bonus-predictions.yml
    with:
      community: "ehonda-ai-arena"
      community_context: "ehonda-ai-arena"
      competition: "bundesliga-2026-27"
      model: "gpt-5.6-luna"
      reasoning_effort: "none"
      max_output_tokens: 10000
      prompt_source: "langfuse"
      langfuse_prompt_name: "kicktippai/bundesliga-2026-27/predict-bonus"
      langfuse_prompt_label: "production"
      langfuse_prompt_version: 1
      bonus_context_document_budget: 20
      bonus_context_token_budget: 32000
      trigger_type: "scheduled"
      force_prediction: true
      max_repredictions: 0
    secrets:
      kicktipp_username: ${{ secrets.EHONDA_AI_ARENA_GPT_5_6_LUNA_NONE_KICKTIPP_USERNAME }}
      kicktipp_password: ${{ secrets.EHONDA_AI_ARENA_GPT_5_6_LUNA_NONE_KICKTIPP_PASSWORD }}
      firebase_project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
      firebase_service_account_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      langfuse_secret_key: ${{ secrets.LANGFUSE_SECRET_KEY }}
